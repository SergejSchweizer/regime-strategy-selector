[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-strategy-selector"
version = "0.0.0"
description = "Regime-aware BTC perpetual research and decision system"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
  "mypy==1.11.2",
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "ruff==0.6.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: hermetic integration tests that cross package/module boundaries",
  "external_service: tests that require an explicitly configured external service",
]

[tool.coverage.run]
branch = true
source = ["regime_strategy_selector"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
precision = 2
